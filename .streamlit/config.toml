[theme]
primaryColor = "#6366f1"
backgroundColor = "#f6f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
port = 8502
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true

[logger]
level = "info"
